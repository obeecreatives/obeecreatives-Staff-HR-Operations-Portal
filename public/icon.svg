<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#141D2E" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E2E" />
      <stop offset="100%" stop-color="#B80000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E30000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#253248" stroke-width="6" opacity="0.6"/>

  <!-- Creative Center Brand Motif: obeecreatives 'O' + Aperture Star -->
  <g filter="url(#glow)">
    <!-- Outer Camera Ring -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#redGrad)" stroke-width="28" />
    <!-- Inner Creative Lens Core -->
    <circle cx="256" cy="256" r="80" fill="#E30000" />
    <circle cx="256" cy="256" r="48" fill="#090D16" />
    <!-- Center Dot -->
    <circle cx="256" cy="256" r="20" fill="#FFFFFF" />
    <!-- Recording Indicator Dot -->
    <circle cx="346" cy="166" r="18" fill="#FF3B3B" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="2">
    OBEE<tspan fill="#E30000">CREATIVES</tspan>
  </text>
</svg>
